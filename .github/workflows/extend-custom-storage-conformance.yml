name: Extend custom storage conformance

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/extend_custom_storage_conformance.py
      - .github/workflows/extend-custom-storage-conformance.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/extend_custom_storage_conformance.py
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/CustomStorage/CustomStorage.ino
          git commit -m "Harden custom storage conformance"
          git push origin HEAD:feature/pluggable-storage-0.2.0
