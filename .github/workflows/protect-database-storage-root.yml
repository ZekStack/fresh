name: Protect database storage root

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/protect_database_storage_root.py
      - .github/workflows/protect-database-storage-root.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/protect_database_storage_root.py
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/internal/FreshStorageContext.h src/internal/FreshStorageContext.cpp src/FreshStorage.h src/FreshStorageBackend.cpp src/Fresh.cpp
          git commit -m "Protect Fresh database storage paths"
          git push origin HEAD:feature/pluggable-storage-0.2.0
