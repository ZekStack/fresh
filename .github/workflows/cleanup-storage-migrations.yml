name: Cleanup storage migrations

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/cleanup_storage_migrations.py
      - .github/workflows/cleanup-storage-migrations.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/cleanup_storage_migrations.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove storage migration infrastructure"
          git push origin HEAD:feature/pluggable-storage-0.2.0
