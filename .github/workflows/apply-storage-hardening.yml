name: Apply storage hardening migration

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/apply_storage_hardening.py
      - .github/workflows/apply-storage-hardening.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
          fetch-depth: 0

      - name: Apply guarded migration
        run: python3 scripts/apply_storage_hardening.py

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes were required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Fresh.h src/Fresh.cpp src/FreshModel.cpp
          git commit -m "Harden storage lifecycle and diagnostics"
          git push origin HEAD:feature/pluggable-storage-0.2.0
