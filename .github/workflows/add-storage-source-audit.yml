name: Add storage source audit

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/add_storage_source_audit.py
      - .github/workflows/add-storage-source-audit.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/add_storage_source_audit.py
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Audit pluggable storage boundaries"
          git push origin HEAD:feature/pluggable-storage-0.2.0
