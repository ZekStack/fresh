name: Apply storage ID allocation fix

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - .github/workflows/apply-storage-id-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
          fetch-depth: 0

      - name: Apply result-aware storage ID allocation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/FreshStorage.cpp")
          source = path.read_text()
          old = '''\t\tfor (const auto &entry : _models) {
          \t\t\tconst auto &state = entry.second;
          \t\t\tif (!state->dropped && state->storageId.empty()) {
          \t\t\t\tdo {
          \t\t\t\t\tstate->storageId = FreshMakeId();
          \t\t\t\t} while (usedStorageIds.find(state->storageId) != usedStorageIds.end() ||
          \t\t\t\t         FreshFS.exists(modelPath(state->storageId).c_str()));
          \t\t\t\tusedStorageIds.insert(state->storageId);
          \t\t\t\tstate->storageEpoch++;
          \t\t\t\tstate->dirty = true;
          \t\t\t\tstate->snapshotRequired = true;
          \t\t\t\t_manifestDirty = true;
          \t\t\t\t_manifestEpoch++;
          \t\t\t}
          \t\t}
          '''
          new = '''\t\tconstexpr size_t maxStorageIdAttempts = 64;
          \t\tfor (const auto &entry : _models) {
          \t\t\tconst auto &state = entry.second;
          \t\t\tif (!state->dropped && state->storageId.empty()) {
          \t\t\t\tstd::string selectedStorageId;
          \t\t\t\tbool selected = false;
          \t\t\t\tfor (size_t attempt = 0; attempt < maxStorageIdAttempts; ++attempt) {
          \t\t\t\t\tstd::string candidate = FreshMakeId();
          \t\t\t\t\tif (usedStorageIds.find(candidate) != usedStorageIds.end()) continue;

          \t\t\t\t\tbool pathExists = false;
          \t\t\t\t\tFreshResult existsResult = FreshFS.exists(
          \t\t\t\t\t    modelPath(candidate).c_str(),
          \t\t\t\t\t    pathExists
          \t\t\t\t\t);
          \t\t\t\t\tif (!existsResult) return existsResult;
          \t\t\t\t\tif (!pathExists) {
          \t\t\t\t\t\tselectedStorageId = std::move(candidate);
          \t\t\t\t\t\tselected = true;
          \t\t\t\t\t\tbreak;
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t\tif (!selected) {
          \t\t\t\t\treturn FreshResult::failure(
          \t\t\t\t\t    FreshStatus::InternalError,
          \t\t\t\t\t    "failed to allocate unique model storage id"
          \t\t\t\t\t);
          \t\t\t\t}

          \t\t\t\tstate->storageId = std::move(selectedStorageId);
          \t\t\t\tusedStorageIds.insert(state->storageId);
          \t\t\t\tstate->storageEpoch++;
          \t\t\t\tstate->dirty = true;
          \t\t\t\tstate->snapshotRequired = true;
          \t\t\t\t_manifestDirty = true;
          \t\t\t\t_manifestEpoch++;
          \t\t\t}
          \t\t}
          '''
          if source.count(old) != 1:
              raise SystemExit("expected storage ID allocation block not found exactly once")
          path.write_text(source.replace(old, new))

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/apply-storage-id-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FreshStorage.cpp .github/workflows/apply-storage-id-fix.yml
          git commit -m "fix: propagate storage id probe failures"
          git push origin HEAD:feature/pluggable-storage-0.2.0
