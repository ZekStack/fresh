name: Fix custom storage example

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/fix_custom_storage_example.py
      - .github/workflows/fix-custom-storage-example.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/fix_custom_storage_example.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/CustomStorage/CustomStorage.ino
          git commit -m "Fix custom storage conformance example"
          git push origin HEAD:feature/pluggable-storage-0.2.0
