name: Update storage documentation

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/update_storage_documentation.py
      - .github/workflows/update-storage-documentation.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/update_storage_documentation.py
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/api.md docs/examples.md
          git commit -m "Document pluggable storage APIs"
          git push origin HEAD:feature/pluggable-storage-0.2.0
