name: Harden storage durability

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/harden_storage_durability.py
      - .github/workflows/harden-storage-durability.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/harden_storage_durability.py
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FreshFile.cpp src/FreshStorage.cpp src/FreshBackupRestore.cpp src/internal/FreshStorageContext.cpp
          git commit -m "Harden storage durability semantics"
          git push origin HEAD:feature/pluggable-storage-0.2.0
