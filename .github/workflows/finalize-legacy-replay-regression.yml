name: Finalize legacy replay regression

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - .github/workflows/finalize-legacy-replay-regression.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
          fetch-depth: 0

      - name: Fix task creation and document regression
        shell: python
        run: |
          from pathlib import Path

          example_path = Path("examples/LegacyDatabaseP4RegressionTest/LegacyDatabaseP4RegressionTest.ino")
          example = example_path.read_text()
          old = '''\t    5,
          \t    nullptr,
          \t    nullptr,
          \t    0
          \t);
          '''
          new = '''\t    5,
          \t    nullptr,
          \t    0
          \t);
          '''
          if example.count(old) != 1:
              raise SystemExit("replay task creation block did not match exactly once")
          example_path.write_text(example.replace(old, new))

          docs_path = Path("docs/examples.md")
          docs = docs_path.read_text()
          marker = '''## SelfTest
          '''
          section = '''## LegacyDatabaseP4RegressionTest

          Path: [`../examples/LegacyDatabaseP4RegressionTest/LegacyDatabaseP4RegressionTest.ino`](../examples/LegacyDatabaseP4RegressionTest/LegacyDatabaseP4RegressionTest.ino)

          ESP32-P4 two-boot runtime regression for Fresh 0.1.1 database compatibility. The first boot writes a byte-compatible legacy manifest and a 2,048-record `journal.log` through Arduino LittleFS, then restarts. The second boot mounts the existing partition through Fresh 0.2.0, replays on a CPU0-pinned task, verifies every record, checks that a priority-zero CPU0 probe ran during replay, and validates cached VFS file-size growth across write, append, and read opens.

          Run this sketch with the five-second CPU0 idle-task watchdog used by the target application. CI compiles the sketch for ESP32-P4 but cannot execute the two-boot hardware test.

          '''
          if docs.count(marker) != 1:
              raise SystemExit("examples documentation insertion point did not match exactly once")
          docs_path.write_text(docs.replace(marker, section + marker))

          progress_path = Path("docs/0.2.0-storage-progress.md")
          progress = progress_path.read_text()
          old = '''- [x] Add LittleFS, SDSPI, SDMMC, custom storage, backup, lifecycle, and failure examples
          '''
          new = '''- [x] Add LittleFS, SDSPI, SDMMC, custom storage, backup, lifecycle, failure, and legacy-replay examples
          '''
          if progress.count(old) != 1:
              raise SystemExit("progress example checklist did not match exactly once")
          progress = progress.replace(old, new)

          old = '''- [x] New storage lifecycle and failure regression examples
          '''
          new = '''- [x] New storage lifecycle and failure regression examples
          - [x] Compile the ESP32-P4 two-boot Fresh 0.1.1 journal replay regression
          '''
          if progress.count(old) != 1:
              raise SystemExit("progress validation checklist did not match exactly once")
          progress = progress.replace(old, new)

          old = '''- [ ] Confirm existing LittleFS databases load correctly on device
          '''
          new = '''- [ ] Run `LegacyDatabaseP4RegressionTest` with the target five-second CPU0 idle watchdog
          - [ ] Confirm representative production LittleFS databases load correctly on device
          '''
          if progress.count(old) != 1:
              raise SystemExit("progress hardware checklist did not match exactly once")
          progress_path.write_text(progress.replace(old, new))

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'LegacyDatabaseP4RegressionTest' docs/examples.md
          grep -q 'priority-zero CPU0 probe' docs/examples.md

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/finalize-legacy-replay-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/LegacyDatabaseP4RegressionTest/LegacyDatabaseP4RegressionTest.ino docs/examples.md docs/0.2.0-storage-progress.md .github/workflows/finalize-legacy-replay-regression.yml
          git commit -m "test: finalize P4 legacy replay regression"
          git push origin HEAD:feature/pluggable-storage-0.2.0
