name: Generalize persistence streams

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/generalize_persistence_streams.py
      - .github/workflows/generalize-persistence-streams.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/generalize_persistence_streams.py
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FreshUtils.cpp
          git commit -m "Generalize persistence binary streams"
          git push origin HEAD:feature/pluggable-storage-0.2.0
