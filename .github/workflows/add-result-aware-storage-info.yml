name: Add result-aware storage information

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/add_result_aware_storage_info.py
      - .github/workflows/add-result-aware-storage-info.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
      - run: python3 scripts/add_result_aware_storage_info.py
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FreshStorage.h src/FreshStorageBackend.cpp src/storage/FreshLittleFSStorage.h src/storage/FreshLittleFSStorage.cpp src/storage/FreshSDStorage.h src/storage/FreshSDStorage.cpp src/internal/FreshStorageReference.h src/internal/FreshStorageReference.cpp src/Fresh.h src/Fresh.cpp src/FreshStorage.cpp src/FreshGarbageCollection.cpp
          git commit -m "Add result-aware storage information"
          git push origin HEAD:feature/pluggable-storage-0.2.0
