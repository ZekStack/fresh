name: Apply result-aware directory check

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - .github/workflows/apply-ensure-dir-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
          fetch-depth: 0

      - name: Apply result-aware ensureDir
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/FreshStorage.cpp")
          source = path.read_text()
          old = '''FreshResult Fresh::ensureDir(const std::string &path) {
          \tif (FreshFS.exists(path.c_str())) {
          \t\treturn FreshResult::success();
          \t}
          \tif (!FreshFS.mkdir(path.c_str())) {
          \t\treturn FreshResult::failure(FreshStatus::FileSystemError, "failed to create directory");
          \t}
          \treturn FreshResult::success();
          }
          '''
          new = '''FreshResult Fresh::ensureDir(const std::string &path) {
          \tbool exists = false;
          \tFreshResult existsResult = FreshFS.exists(path.c_str(), exists);
          \tif (!existsResult) return existsResult;
          \tif (exists) return FreshResult::success();
          \tif (!FreshFS.mkdir(path.c_str())) {
          \t\treturn FreshResult::failure(FreshStatus::FileSystemError, "failed to create directory");
          \t}
          \treturn FreshResult::success();
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("expected ensureDir block not found exactly once")
          path.write_text(source.replace(old, new))

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/apply-ensure-dir-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FreshStorage.cpp .github/workflows/apply-ensure-dir-fix.yml
          git commit -m "fix: propagate directory existence failures"
          git push origin HEAD:feature/pluggable-storage-0.2.0
