name: Storage Validation

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0

concurrency:
  group: storage-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_VERSION: 6.1.19

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: python3 scripts/check_version_consistency.py

      - name: Reject Arduino filesystem coupling
        run: |
          if grep -RInE '#include[[:space:]]*[<"](LittleFS|SD|SD_MMC)\.h[>"]' src; then
            echo "Production storage code must use FreshStorage or ESP-IDF backends"
            exit 1
          fi
          if grep -RInE '(^|[^[:alnum:]_])LittleFS[[:space:]]*\.' src; then
            echo "Direct LittleFS singleton access is forbidden"
            exit 1
          fi

  build-examples:
    runs-on: ubuntu-latest
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-p4-evboard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PIOArduino
        run: |
          python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"
          pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"

      - name: Build every example
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Building $d on ${{ matrix.board }}"
              pio ci "$d" \
                --board "${{ matrix.board }}" \
                --lib="." \
                --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
                --project-option "build_unflags=-std=gnu++11" \
                --project-option "build_flags=-std=gnu++20"
            fi
          done
