name: Cleanup storage symbols

on:
  push:
    branches:
      - feature/pluggable-storage-0.2.0
    paths:
      - scripts/cleanup_storage_symbols.py
      - .github/workflows/cleanup-storage-symbols.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/pluggable-storage-0.2.0
          fetch-depth: 0

      - name: Cleanup compatibility symbols
        run: python3 scripts/cleanup_storage_symbols.py

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes were required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FreshStorage.cpp src/FreshBackupRestore.cpp src/FreshModel.cpp
          git commit -m "Remove LittleFS persistence symbols"
          git push origin HEAD:feature/pluggable-storage-0.2.0
